[project]
name = "customer-support-fde"
version = "0.10.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "agentevals>=0.0.9",
    "arize-phoenix-otel>=0.17.1",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.1",
    "langgraph>=1.2.11",
    "ntplib>=0.4.0",
    "openinference-instrumentation-langchain>=0.1.76",
    "presidio>=2.2.364",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "tzdata>=2026.4",
]

[project.scripts]
start = "customer_support_fde:main"

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest-tmp -m \"not e2e\""
markers = [
    "e2e: end-to-end tests that call the real OpenRouter LLM; excluded by default, run with `-m e2e`.",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
